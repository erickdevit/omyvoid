workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH =~ /^(dev|rc|main)$/'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - when: never

stages:
  - validate

variables:
  GIT_DEPTH: "0"
  FF_USE_LEGACY_EXECUTION_STRATEGY: "true"

validate:
  stage: validate
  image:
    name: ghcr.io/void-linux/void-glibc-full:latest
    entrypoint: ["/bin/dash", "-c", "xbps-install -Sy bash ca-certificates git && exec bash \"$@\""]
  timeout: 45m
  before_script:
    - release/ci-prepare-void.sh test
  script:
    - test/ci.sh
