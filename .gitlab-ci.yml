workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH =~ /^(dev|rc|main)$/'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - when: never

stages:
  - validate
  - packages
  - image
  - release

variables:
  GIT_DEPTH: "0"
  FF_USE_LEGACY_EXECUTION_STRATEGY: "true"

validate:
  stage: validate
  image:
    name: ghcr.io/void-linux/void-glibc-full:latest
    entrypoint: ["/usr/bin/dash", "-c", "xbps-install -Sy bash ca-certificates git >/dev/null 2>&1 && ln -sf /usr/bin/bash /bin/bash && exec /usr/bin/bash \"$@\"", "bash"]
  timeout: 45m
  before_script:
    - release/ci-prepare-void.sh test
  script:
    - test/ci.sh

packages:
  stage: packages
  tags:
    - void-linux
    - x86_64
    - omyvoid-builder
  timeout: 2h
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH =~ /^(dev|rc|main)$/'
    - if: '$CI_PIPELINE_SOURCE == "web"'
  before_script:
    - release/ci-prepare-void.sh packages
  script:
    - release/build-xbps-repo.sh build/repository
    - release/inspect-xbps-repo.sh build/repository
  artifacts:
    name: "omyvoid-xbps-$CI_COMMIT_SHA"
    expire_in: 7 days
    paths:
      - build/repository/

iso:dev:
  stage: image
  tags:
    - void-linux
    - x86_64
    - omyvoid-release
  timeout: 4h
  environment:
    name: development
  needs:
    - job: packages
      artifacts: false
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
      when: manual
      allow_failure: true
  before_script:
    - release/ci-prepare-void.sh builder
  script:
    - install/iso/build-iso.sh
    - release/inspect-iso.sh "build/omyvoid-$(cat version)-x86_64.iso"
  artifacts:
    name: "omyvoid-dev-$CI_COMMIT_SHA"
    expire_in: 14 days
    paths:
      - build/*.iso
      - build/*.sha256

release:
  stage: release
  tags:
    - void-linux
    - x86_64
    - omyvoid-release
  timeout: 4h
  resource_group: production
  environment:
    name: production
    url: "$OMYVOID_R2_PUBLIC_URL"
  needs:
    - job: packages
      artifacts: false
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$/'
  variables:
    GLAB_ENABLE_CI_AUTOLOGIN: "true"
  before_script:
    - release/ci-prepare-void.sh builder
  script:
    - |
      version=$(cat version)
      [[ $CI_COMMIT_TAG == "v$version" ]] || {
        echo "Tag $CI_COMMIT_TAG does not match version $version" >&2
        exit 1
      }
      for variable in \
        R2_ACCESS_KEY_ID \
        R2_SECRET_ACCESS_KEY \
        R2_ACCOUNT_ID \
        R2_BUCKET \
        OMYVOID_R2_PUBLIC_URL \
        OMYVOID_XBPS_PUBLIC_URL \
        OMYVOID_XBPS_SIGNING_KEY_FILE \
        OMYVOID_MINISIGN_SECRET_KEY_FILE \
        OMYVOID_MINISIGN_PUBLIC_KEY_FILE; do
        [[ -n ${!variable:-} ]] || {
          echo "Missing release configuration: $variable" >&2
          exit 1
        }
      done
      for key_file in \
        "$OMYVOID_XBPS_SIGNING_KEY_FILE" \
        "$OMYVOID_MINISIGN_SECRET_KEY_FILE" \
        "$OMYVOID_MINISIGN_PUBLIC_KEY_FILE"; do
        [[ -f $key_file ]] || {
          echo "Signing key file is missing: $key_file" >&2
          exit 1
        }
      done
    - |
      OMYVOID_RELEASE_BUILD=true \
      OMYVOID_XBPS_SIGNING_KEY="$OMYVOID_XBPS_SIGNING_KEY_FILE" \
      OMYVOID_MINISIGN_KEY="$OMYVOID_MINISIGN_SECRET_KEY_FILE" \
        install/iso/build-iso.sh
    - release/inspect-iso.sh "build/omyvoid-$(cat version)-x86_64.iso"
    - release/publish-r2.sh "build/omyvoid-$(cat version)-x86_64.iso" build/iso/repository
    - |
      version=$(cat version)
      iso_name="omyvoid-${version}-x86_64.iso"
      release_url="${OMYVOID_R2_PUBLIC_URL%/}/releases/${version}"
      assets=$(jq -cn \
        --arg iso "$release_url/$iso_name" \
        --arg checksum "$release_url/$iso_name.sha256" \
        --arg signature "$release_url/$iso_name.minisig" \
        '[
          {name: "Omyvoid ISO", url: $iso, link_type: "other"},
          {name: "SHA-256 checksum", url: $checksum, link_type: "other"},
          {name: "Minisign signature", url: $signature, link_type: "other"}
        ]')
      glab release create "$CI_COMMIT_TAG" \
        --name "Omyvoid $version" \
        --notes "Signed Omyvoid $version release. Artifacts are hosted and verified through Cloudflare R2." \
        --assets-links="$assets"
  artifacts:
    name: "omyvoid-$CI_COMMIT_TAG"
    expire_in: 14 days
    paths:
      - build/*.iso
      - build/*.sha256
      - build/*.minisig
