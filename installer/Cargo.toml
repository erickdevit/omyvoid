[package]
name = "omyvoid-installer"
version = "0.1.0-dev.1"
edition = "2021"

[[bin]]
name = "omyvoid-installer"
path = "src/main.rs"

[[bin]]
name = "omyvoid-tui-monitors"
path = "src/monitors_main.rs"

[dependencies]
ratatui    = "0.30"
crossterm  = "0.29"
serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level     = 3
strip         = true
lto           = true
codegen-units = 1
