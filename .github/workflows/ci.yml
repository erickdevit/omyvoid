name: CI

on:
  push:
    branches: [dev, rc, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: [self-hosted, void-linux, x86_64, omyvoid-builder]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Verify runner and dependencies
        run: |
          grep -q '^ID=void$' /etc/os-release
          sudo xbps-install -Syu
          sudo xbps-install -Sy bash cargo git jq ripgrep shellcheck xtools xorriso

      - name: ShellCheck
        run: |
          scripts=()
          while IFS= read -r script; do
            [[ $(head -n 1 "$script") == *python* ]] && continue
            scripts+=("$script")
          done < <(find bin install release test -type f \( -name '*.sh' -o -path 'bin/omyvoid*' \))
          shellcheck -S error -s bash -e SC1090,SC1091 "${scripts[@]}"

      - name: Bash, CLI and architecture tests
        run: test/run.sh

      - name: Rust format, lint and tests
        run: |
          cargo fmt --manifest-path installer/Cargo.toml -- --check
          cargo clippy --locked --manifest-path installer/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path installer/Cargo.toml

      - name: Validate XBPS templates
        run: |
          for template in xbps-src/srcpkgs/*/template; do
            xlint "$template"
          done

  packages:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/dev'
    needs: test
    runs-on: [self-hosted, void-linux, x86_64, omyvoid-builder]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Build complementary XBPS repository
        run: release/build-xbps-repo.sh build/repository
      - name: Inspect repository
        run: |
          test -f build/repository/x86_64-repodata
          xbps-query --repository="$PWD/build/repository" -Rs '^omyvoid-|^ukify$'
      - uses: actions/upload-artifact@v4
        with:
          name: omyvoid-xbps-${{ github.sha }}
          path: build/repository
          retention-days: 7
