name: CI

on:
  push:
    branches: [dev, rc, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/void-linux/void-glibc-full:latest
    timeout-minutes: 45
    steps:
      - name: Bootstrap checkout dependencies
        run: |
          xbps-install -Syu xbps
          xbps-install -Sy bash ca-certificates git

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare Void validation environment
        run: release/ci-prepare-void.sh test

      - name: Validate source, CLI, Rust and XBPS templates
        run: test/ci.sh

  packages:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/dev'
    needs: test
    runs-on: [self-hosted, void-linux, x86_64, omyvoid-builder]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare Void package builder
        run: release/ci-prepare-void.sh packages
      - name: Build complementary XBPS repository
        run: release/build-xbps-repo.sh build/repository
      - name: Inspect repository
        run: release/inspect-xbps-repo.sh build/repository
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: omyvoid-xbps-${{ github.sha }}
          path: build/repository
          retention-days: 7
