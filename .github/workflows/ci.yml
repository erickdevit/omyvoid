name: CI

on:
  push:
    branches: [dev, rc, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/void-linux/void-glibc-full:latest
    timeout-minutes: 45
    steps:
      - name: Bootstrap checkout dependencies
        run: |
          xbps-install -Syu xbps
          xbps-install -Sy bash ca-certificates git

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare Void validation environment
        run: release/ci-prepare-void.sh test

      - name: Validate source, CLI, Rust and XBPS templates
        run: test/ci.sh
