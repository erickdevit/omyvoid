name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: [self-hosted, void-linux, x86_64, omyvoid-builder]
    timeout-minutes: 240
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      OMYVOID_R2_PUBLIC_URL: ${{ vars.OMYVOID_R2_PUBLIC_URL }}
      OMYVOID_XBPS_PUBLIC_URL: ${{ vars.OMYVOID_XBPS_PUBLIC_URL }}
      XBPS_PASSPHRASE: ${{ secrets.OMYVOID_XBPS_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release identity
        run: |
          version=$(cat version)
          if [[ $GITHUB_REF_TYPE == tag && $GITHUB_REF_NAME != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match version $version" >&2
            exit 1
          fi

      - name: Test source
        run: |
          test/run.sh
          cargo test --locked --manifest-path installer/Cargo.toml

      - name: Materialize signing keys
        env:
          XBPS_KEY: ${{ secrets.OMYVOID_XBPS_SIGNING_KEY }}
          MINISIGN_SECRET: ${{ secrets.OMYVOID_MINISIGN_SECRET_KEY }}
          MINISIGN_PUBLIC: ${{ secrets.OMYVOID_MINISIGN_PUBLIC_KEY }}
        run: |
          umask 077
          printf '%s\n' "$XBPS_KEY" > "$RUNNER_TEMP/omyvoid-xbps.pem"
          printf '%s\n' "$MINISIGN_SECRET" > "$RUNNER_TEMP/omyvoid-minisign.key"
          printf '%s\n' "$MINISIGN_PUBLIC" > "$RUNNER_TEMP/omyvoid-minisign.pub"

      - name: Build signed offline ISO
        env:
          OMYVOID_RELEASE_BUILD: 'true'
          OMYVOID_XBPS_SIGNING_KEY: ${{ runner.temp }}/omyvoid-xbps.pem
          OMYVOID_MINISIGN_KEY: ${{ runner.temp }}/omyvoid-minisign.key
        run: install/iso/build-iso.sh

      - name: Inspect ISO
        run: release/inspect-iso.sh "build/omyvoid-$(cat version)-x86_64.iso"

      - name: Publish to R2 and verify public download
        env:
          OMYVOID_MINISIGN_PUBLIC_KEY_FILE: ${{ runner.temp }}/omyvoid-minisign.pub
        run: release/publish-r2.sh "build/omyvoid-$(cat version)-x86_64.iso" build/iso/repository

      - uses: actions/upload-artifact@v4
        with:
          name: omyvoid-${{ github.sha }}
          path: |
            build/*.iso
            build/*.sha256
            build/*.minisig
          retention-days: 14

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(cat version)
          prerelease=()
          [[ $version == *-* ]] && prerelease=(--prerelease)
          gh release create "$GITHUB_REF_NAME" build/*.iso build/*.sha256 build/*.minisig \
            --title "Omyvoid $version" --generate-notes "${prerelease[@]}"
