exec-once = hypridle
exec-once = runsvdir -P $HOME/.config/service
exec-once = mako
exec-once = ! omyvoid-toggle-enabled waybar-off && waybar
exec-once = fcitx5 --disable notificationitem
exec-once = swaybg -i ~/.config/omyvoid/current/background -m fill
exec-once = /usr/libexec/hyprpolkitagent
exec-once = omyvoid-first-run
exec-once = omyvoid-powerprofiles-init
exec-once = omyvoid-hyprland-monitor-watch
exec-once = omyvoid-live-session-setup

# Export the session environment to D-Bus activated desktop services.
exec-once = dbus-update-activation-environment --all

# Run post-boot hooks after startup config has loaded
exec-once = sleep 2 && omyvoid-hook post-boot
